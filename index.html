<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VIVID IELTS — Redirecting</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    html,body{height:100%;margin:0}
    body{display:grid;place-items:center;font-family:Inter,system-ui,sans-serif;background:#0f172a;color:#fff}
    .box{text-align:center;padding:32px}
    .mark{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;margin:0 auto 16px;background:linear-gradient(135deg,#7c3aed,#22d3ee);font-weight:800}
    p{opacity:.72}
  </style>
  <script>
    (function () {
      var target = "https://ielts-upgradecom.vercel.app";
      var next = target + "/" + (location.search || "") + (location.hash || "");
      location.replace(next);
    })();
  </script>
</head>
<body>
  <div class="box"><div class="mark">V</div><strong>VIVID IELTS</strong><p>Opening the current VIVID IELTS site…</p></div>
</body>
</html>
